name: Deploy Staging

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application for staging
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging

      - name: Run app tests
        run: npm test

      - name: Run functions tests
        run: npm run test:functions

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    environment:
      name: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Apply staging database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Build application for staging
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging

      - name: Deploy staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: staging
          secrets: |
            APP_TOKEN_SECRET
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_URL
          command: deploy
        env:
          APP_TOKEN_SECRET: ${{ secrets.APP_TOKEN_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - name: Run deployed staging smoke tests
        env:
          SMOKE_ADMIN_KEY: ${{ secrets.SMOKE_ADMIN_KEY }}
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npm run test:smoke:api:staging