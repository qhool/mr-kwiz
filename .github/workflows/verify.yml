name: Verify

on:
  workflow_call:
    inputs:
      cloudflare_env:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify schema reference freshness
        run: npm run verify:schema-reference

      - name: Build application
        if: ${{ inputs.cloudflare_env == '' }}
        run: npm run build

      - name: Build application for Cloudflare environment
        if: ${{ inputs.cloudflare_env != '' }}
        run: npm run build
        env:
          CLOUDFLARE_ENV: ${{ inputs.cloudflare_env }}

      - name: Run app tests
        run: npm test

      - name: Run functions tests
        run: npm run test:functions