name = "mr-kwiz"
main = "src/worker.ts"
compatibility_date = "2026-05-24"
upload_source_maps = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[secrets]
required = ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "APP_TOKEN_SECRET"]

[env.staging]
name = "mrkwiz-staging"

[env.staging.secrets]
required = ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "APP_TOKEN_SECRET"]

[env.production]
name = "mrkwiz"

[env.production.secrets]
required = ["SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY", "APP_TOKEN_SECRET"]